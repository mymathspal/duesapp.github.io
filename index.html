<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/styles.css">
    <link rel = "icon" type="image/svg" href="assets/logo.svg">
    <title>HomePage</title>
</head>
<body class="pageBodies">

    <nav>
        <div role="navigation bar" aria-label="Homepage navigation bar" class="Nav">
            <span class="logoBox"><img src="assets/logo.svg" alt="enkab cms logo" class="logo"></span>
            <!-- <span class="userProfileSection" title="Profile Picture">N</span><br> -->

            <span class="editMode">
                <label for = "switch" class="switch-container"> 
                <input type="checkbox" id="switch" class="switch-checkbox">
                <span class="switch-ball"></span></label>
            </span>

            <div class="intro">
            <span class="introSection">
            <p class="nameIntro">Hi, Nana Kwame!</p>
            <p class="subIntro">What would you like to do today?</p>
            </span>

            <span class="statusSection">
                <p class="userRole">Treasurer</p>
                <p class="orgName">CACI - Birmingham</p>
            </span>
        </div>
    </nav>

    <!-- <div class="editMode">
        <label for = "switch" class="switch-container"> 
            <input type="checkbox" id="switch" class="switch-checkbox">
            <span class="switch-ball"></span></label>
    </div> -->

    <p class="sectionTitle">Overview</p>
    <div id="overviewContainer" class="overviewContainer">
        <div class="totalAmount">
            <span class="amount number">£1000.00</span>
            <span class="overviewText">Total Amount</span>
        </div>
        <div class="numberOfMembers">
            <span class="memberNum number">67</span>
            <span class="overviewText">Total Members Contributed</span>
        </div>
    </div>

    <p class="sectionTitle">Quick Actions</p>
    <div class="actionBtnSection">
        <input type="submit" value="Add Member" id="addMemberBtn" class="addMemberBtn actionBtn">

        <dialog class="addMemberModal">
            <form class="addMemberForm" method="post">
                <label for="name" class="formLabel"><p class="formTitle">Name: </p><input type="text" placeholder="Joe White" id="name" name="name" autocomplete="off" class="memberName" required></label>
                <label for="amount" class="formLabel"><p class="formTitle">Amount (£): </p><input type="number" id="amount" name="amount" placeholder="£500" class=""></label>
                <div class="modalActions">
                <button class="modalCancelBtn">Cancel</button>
                <button class="modalAddMemberBtn">Submit</button>
                </div>
             </form>
        </dialog>

        <input type="submit" value="Add Contribution" id="addContributionBtn" class="addContributionBtn actionBtn">

         <dialog class="addContributionModal">
            <form class="addContributionForm">
                <label for="name" class="formLabel"><p class="formTitle">Name</p><input type="text" placeholder="Search Name..." id="name" name="name" autocomplete="off" class = "" required></label>
                <label for="amount" class="formLabel"><p class="formTitle">Enter Amount (£): </p><input type="number" id="amount" name="amount" placeholder="£500" class=""></label>
                <div class="modalActions">
                <button class="modalCancelBtn">Cancel</button>
                <button class="submitContributionBtn">Submit</button>
                </div>
            </form>
        </dialog>

        <a href="records.html"><input type="submit" value="View Records" id="viewRecords" class="viewRecordsBtn actionBtn"></a>

    </div>

    <div>
        
    </div>


    <footer>
        
    </footer>


    <script src="assets/scripts.js" defer></script>
</body>
</html>
